<style>
/*
VOICE: 밝고 산뜻한 학원 업무 앱. 일하는 화면은 차분하게, 강조는 확실하게.

*/
@font-face{font-family:"HeirofLight";src:url("fonts/heiroflight-regular.woff2") format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"HeirofLight";src:url("fonts/heiroflight-bold.woff2") format("woff2");font-weight:600 900;font-display:swap}
@font-face{font-family:"LevelUp";src:url("fonts/levelup-regular.woff2") format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"LevelUp";src:url("fonts/levelup-bold.woff2") format("woff2");font-weight:600 900;font-display:swap}
:root{color-scheme:light dark;
--bg:light-dark(#f7f3f5,#121014);--card:light-dark(#ffffff,#1c181b);--soft:light-dark(#f4eef1,#262024);--ink:light-dark(#1d1a1e,#f4eff2);--mut:light-dark(#77707a,#a99fa6);
--red:light-dark(#e2384f,#ff6b80);--coral:light-dark(#ff7a59,#ff9a7a);--redt:light-dark(#fde8ec,#3b1f27);--line:light-dark(#f4c6ce,#4d2c35);--hair:light-dark(#ece6e9,#2e272c);
--ok:light-dark(#18885a,#5fd39a);--okt:light-dark(#dff5ea,#173326);--mid:light-dark(#a26d00,#f2c14e);--midt:light-dark(#fdf0d3,#3a2f14);--blue:light-dark(#3a6df0,#7da1ff);--bluet:light-dark(#e6edff,#1d2747);
--sh:0 1px 2px rgba(40,10,20,.04),0 8px 24px rgba(40,10,20,.06);--grad:linear-gradient(135deg,var(--red),var(--coral))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root.fs-l{font-size:17.5px}:root.fs-s{font-size:15px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--font,HeirofLight),system-ui,-apple-system,"Malgun Gothic",sans-serif;overflow-x:clip;letter-spacing:-.01em}
button{font:inherit;color:inherit}
input,select,textarea{font-size:16px;font-family:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--hair);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{accent-color:var(--red)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut)}
label>input,label>select,label>textarea{margin-top:4px}
h1{font-size:1.6rem;line-height:1.15;margin:0 0 4px}
h2{font-size:1.1rem;margin:24px 0 10px}
h3{font-size:.95rem;margin:14px 0 8px}
.small{font-size:13px;color:var(--mut)}
svg{flex:none}
input[type=password]{font-family:Verdana,"Segoe UI","Malgun Gothic",system-ui,sans-serif;letter-spacing:.12em}
.linkbtn{border:0;background:none;color:var(--mut);cursor:pointer;padding:6px 4px;font-size:14px;text-decoration:underline;text-underline-offset:3px}.linkbtn:hover{color:var(--ink)}
.pwbox{position:relative;display:block;margin-top:4px}.pwbox input{margin:0;padding-right:76px}.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);color:var(--mut);border-radius:8px;padding:0 10px;height:32px;font-size:13px;font-weight:600;cursor:pointer}
.lvl,.side,.side button,.bnav,.bnav button{font-family:"LevelUp",var(--font,HeirofLight),sans-serif;letter-spacing:0}
/* 레이아웃 */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--hair);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}
.brand img{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 12px rgba(226,56,79,.3)}
.brand b{display:block;font-size:16px;line-height:1.2}.brand span{font-size:12px;color:var(--mut)}
.nav{display:flex;align-items:center;gap:12px;background:transparent;border:0;text-align:left;padding:11px 12px;border-radius:12px;font-weight:600;min-height:46px;cursor:pointer;color:var(--mut);width:100%}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(226,56,79,.28)}
.side .sp{flex:1}
.invite{background:var(--soft);border-radius:14px;padding:12px;font-size:13px;color:var(--mut)}
.invite b{display:block;color:var(--ink);font-size:18px;letter-spacing:.08em;margin-top:2px}
.col{display:flex;flex-direction:column;min-height:100vh}
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(3vw,16px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.hdr .crumb{font-size:13px;color:var(--mut)}.hdr .crumb b{color:var(--ink)}
.hdr-r{display:flex;align-items:center;gap:8px;position:relative}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--hair);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.ibtn:hover{color:var(--ink)}
.uchip{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);background:var(--card);border-radius:14px;padding:5px 10px 5px 5px;cursor:pointer;min-height:44px}
.av{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.av.lg{width:52px;height:52px;border-radius:14px;font-size:22px}
.uchip .who{text-align:left;line-height:1.2}.uchip .who b{display:block;font-size:14px}.uchip .who span{font-size:12px;color:var(--mut)}
.umenu{position:absolute;right:0;top:52px;width:270px;background:var(--card);border:1px solid var(--hair);border-radius:16px;box-shadow:0 18px 50px rgba(40,10,20,.18);padding:8px;z-index:40}
.umenu .uh{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.umenu .uh b{display:block}.umenu .uh span{font-size:12px;color:var(--mut);word-break:break-all}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px;border-radius:10px;cursor:pointer;text-align:left;min-height:42px}
.mi:hover{background:var(--soft)}.mi.r{color:var(--red)}
.main{padding:22px max(3vw,16px) 96px;max-width:1200px;width:100%}
.demo{display:flex;gap:8px;align-items:center;background:var(--midt);color:var(--mid);font-size:13px;padding:9px 12px;border-radius:12px;margin-bottom:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
/* 홈 */
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 14px 36px rgba(226,56,79,.28);position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:clamp(1.4rem,3vw,1.9rem)}.hero p{margin:4px 0 0;opacity:.9}
.hero .btn{background:#fff;color:var(--red)}.hero .btn.o{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4)}
.hero>*{position:relative;z-index:1}
/* 공통 요소 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.r{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(226,56,79,.25)}.btn.o{background:var(--card);color:var(--ink);border:1.5px solid var(--hair);box-shadow:none}.btn.s{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--hair);border-radius:18px;padding:16px;background:var(--card);box-shadow:var(--sh)}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--redt);color:var(--red);flex:none}
.kpi .ic.b{background:var(--bluet);color:var(--blue)}.kpi .ic.g{background:var(--okt);color:var(--ok)}.kpi .ic.y{background:var(--midt);color:var(--mid)}
.kpi b{display:block;font-size:1.6rem;line-height:1.1}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--hair);border-radius:14px;padding:12px 14px;background:var(--card);cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 2px rgba(40,10,20,.03)}
.item:hover{border-color:var(--line);box-shadow:var(--sh)}
.item .grow{flex:1}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.r{background:var(--redt);color:var(--red)}.tag.g{background:var(--okt);color:var(--ok)}.tag.y{background:var(--midt);color:var(--mid)}.tag.b{background:var(--bluet);color:var(--blue)}
.lv{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:700}
.lv.상{background:var(--redt);color:var(--red)}.lv.중{background:var(--midt);color:var(--mid)}.lv.하{background:var(--okt);color:var(--ok)}.lv.n{background:var(--soft);color:var(--mut)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin:12px 0 16px;overflow-x:auto;width:fit-content;max-width:100%}
.tab{background:transparent;border:0;padding:8px 16px;font-weight:600;color:var(--mut);border-radius:10px;cursor:pointer;min-height:40px;flex:none}
.tab.on{background:var(--card);color:var(--red);box-shadow:0 2px 6px rgba(40,10,20,.08)}
.seg{display:inline-flex;background:var(--soft);padding:4px;border-radius:12px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--mut);font-weight:600;min-height:36px;padding:0 14px;cursor:pointer;border-radius:9px}
.seg button.on{background:var(--card);color:var(--red);box-shadow:0 2px 6px rgba(40,10,20,.08)}
.seg button:disabled{opacity:.4}
.work{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.omr{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.omr h3{color:var(--red);margin:2px 2px 10px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.q{position:relative;height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;cursor:pointer;display:grid;place-items:center;line-height:1.05;padding:0}
.q small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.q i{position:absolute;top:2px;right:5px;font-size:10px;font-style:normal;color:var(--red)}
.q.x{background:var(--ink);color:var(--bg);border-color:var(--ink)}.q.x small,.q.x i{color:var(--bg)}
.q.cur{outline:3px solid var(--red);outline-offset:1px}
.q.t{border-color:var(--red);background:var(--redt)}
.q.ok{background:var(--okt);border-color:transparent}.q.ok small{color:var(--ok)}
.pad{display:flex;gap:8px;margin:10px 0}
.pad button{flex:1;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--red);font-size:22px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--red);color:#fff}
.res{border-radius:18px;padding:18px;position:sticky;top:84px;background:var(--card);border:1px solid var(--hair);box-shadow:var(--sh)}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score{font-size:clamp(46px,8vw,68px);font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.grade{font-size:26px;font-weight:700;color:var(--ink);white-space:nowrap}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--hair);padding-top:8px;margin-top:8px;font-size:15px}
.kv>span{white-space:nowrap}.kv b{text-align:right}
.warn{background:var(--redt);color:var(--red);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--hair);background:var(--card);border-radius:20px;padding:6px 12px;min-height:36px;font-size:14px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.tbl{background:var(--card);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--grad);border-radius:5px}
.dist{display:flex;gap:2px;height:22px;align-items:flex-end;min-width:90px}
.dist span{flex:1;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}
.dist span.k{background:var(--ok)}
.wq{border:1px solid var(--hair);border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:var(--card)}
.wq .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wq .h b{font-size:16px}
.report{border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;color:#1d1a1e;max-width:720px}
.report .title{padding:12px;font-weight:700;font-size:17px;border-bottom:2px solid #1d1a1e}
.report th{width:30%;background:#fff6f7;font-size:14px;color:#77707a;border-color:#ece6e9}
.report td{white-space:pre-wrap;font-size:15px;border-color:#ece6e9}
.report .foot{padding:10px 12px;text-align:right;font-weight:700;color:#e2384f}
.fig{position:relative;height:230px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.srow:first-of-type{border-top:0}
.srow .lab b{display:block;font-size:15px}.srow .lab span{font-size:13px;color:var(--mut)}
/* 로그인 */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.auth .brandside{background:var(--grad);color:#fff;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.auth .brandside::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.1);right:-140px;bottom:-140px}
.auth .brandside h1{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.15;margin:0}
.auth .brandside ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:15px}
.auth .brandside li{display:flex;gap:10px;align-items:center}
.auth .brandside li span{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.auth .formside{display:grid;place-items:center;padding:24px}
.auth .box{background:var(--card);border-radius:22px;padding:28px;width:min(420px,100%);display:grid;gap:12px;box-shadow:var(--sh);border:1px solid var(--hair)}
.auth .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.auth .logo img{width:42px;height:42px;border-radius:12px}
.err{color:var(--red);font-size:14px;min-height:20px}
.modal{position:fixed;inset:0;background:rgba(20,10,15,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:20px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.empty{padding:28px;text-align:center;color:var(--mut);border:1.5px dashed var(--hair);border-radius:18px;background:var(--card)}
.bnav{display:none}
@media(max-width:860px){
 .app{grid-template-columns:1fr}.side{display:none}
 .uchip .who{display:none}.uchip{padding:5px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--hair);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .bnav button{flex:1;border:0;background:transparent;padding:8px 2px 10px;font-size:12px;font-weight:600;color:var(--mut);min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
 .bnav button.on{color:var(--red)}
 .work{grid-template-columns:1fr}.res{position:static}
 .auth{grid-template-columns:1fr}.auth .brandside{padding:32px 24px}.auth .brandside ul{display:none}
}

/* 달력 */
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calw{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.calc{border:1px solid var(--hair);background:var(--card);border-radius:10px;min-height:76px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13px}
.calc b{font-size:14px}.calc .cs{font-size:11px;color:var(--ink);opacity:.85}.calc .cx{font-size:10px;font-weight:700;color:#fff;background:var(--blue);border-radius:6px;padding:1px 5px;align-self:flex-start}
.calc.tod{border-color:var(--red)}.calc.sel{outline:2px solid var(--red);outline-offset:1px}
@media(max-width:600px){.calc{min-height:56px;padding:4px}.calc .cs{display:none}}
/* 문제은행 */
.drop{border:2px dashed var(--line);border-radius:14px;min-height:140px;display:grid;place-items:center;text-align:center;padding:12px;cursor:pointer;background:var(--soft);color:var(--mut);font-size:14px}
.drop.on{border-color:var(--red);background:var(--redt);color:var(--red)}
.drop img{max-width:100%;max-height:420px;border-radius:8px;background:#fff}
/* 시험지 */
.paper{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:28px 30px;border:1px solid var(--hair);border-radius:6px;font-family:var(--font,HeirofLight),sans-serif}
.phdr{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px double #111;padding-bottom:10px;margin-bottom:16px}
.ptitle{font-size:22px;font-weight:700}.phdr .small{color:#555}
.pname{font-size:14px;white-space:nowrap}.pname span{display:inline-block;min-width:120px;border-bottom:1px solid #111;margin-left:6px;padding:0 4px}
.pbody{column-count:2;column-gap:28px;column-rule:1px solid #bbb}.pbody.c1{column-count:1}
.pset{break-inside:avoid;margin:0 0 12px}.phead{font-weight:700;font-size:14px;margin-bottom:6px}
.pset img,.pq img{display:block;max-width:100%;margin:4px 0}
.pbox{border:1px solid #999;padding:10px;font-size:14px;line-height:1.7}
.pq{break-inside:avoid;margin:0 0 18px;font-size:14px}.pn{display:block;margin-bottom:4px}.pt{white-space:pre-wrap}
.pans{break-before:page;margin-top:24px;padding-top:12px;border-top:2px solid #111}
.pansg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 12px;margin-top:10px;font-size:14px}
@media print{@page{size:A4;margin:12mm}.paper{border:0;padding:0;max-width:none}.pans{margin-top:0;border-top:0}.main .top,.main .small.noprint{display:none!important}}
@media print{.side,.bnav,.hdr,.noprint,.demo{display:none!important}.app{display:block}.main{padding:0}body{background:#fff}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:grid;place-items:center;color:#77707a">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
